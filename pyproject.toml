[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "image-converter"
version = "0.1.0"
description = "Local web application for recursive image format conversion."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "jinja2>=3.1,<4.0",
    "Pillow>=12.3,<13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
